name: host-registration-tests

# Scratch workflow (fork-only branch) to execute the full CPU test file for
# PR #9704 on a Linux runner with vLLM installed. Not part of the pull request.

on:
  push:
    branches: [ci/host-registration-tests]
  workflow_dispatch:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /

      - uses: actions/checkout@v4
        with:
          ref: 9c605be004e1c3df71349b3ca5aaf5d19e3b1212

      - name: Record the tested revision
        run: |
          git rev-parse HEAD
          git log -1 --format='%s'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install vLLM
        run: |
          python -m pip install -U pip
          pip install --no-cache-dir "vllm==0.32.0"

      - name: Install vLLM-Omni requirements
        run: |
          pip install --no-cache-dir -r requirements/cpu.txt
          pip install --no-cache-dir "pytest==9.1.1" "pytest-asyncio==1.4.0" \
            "pytest-cov==7.1.0" "pytest-mock==3.15.1" "pytest-shard==0.1.2" \
            "pytest-xdist==3.8.0" "pytest-subtests==0.15.0" "websockets==16.1" \
            "filelock>=3.16.1,<4" "datasets==3.6.0" psutil

      - name: Show environment
        run: |
          python -c "import sys, torch, vllm; print('python', sys.version); print('vllm', vllm.__version__, 'torch', torch.__version__); print('cuda available', torch.cuda.is_available())"
          df -h /

      - name: Full host-registration test file (20 cases, no selection)
        env:
          HF_HUB_OFFLINE: "1"
        run: |
          python -m pytest tests/platforms/cuda/test_host_registration.py -p no:cacheprovider -v
